name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile package
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest

  jobshoplib-project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/job-shop-lib-rl-scheduling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JobShopLib project
        run: python -m pip install -e '.[dev]'
      - name: Compile JobShopLib project
        run: python -m compileall -q src
      - name: Test JobShopLib project
        run: python -m pytest
